name: Version watch

# Weekly check of every tool a sheet is verified against. A new release line
# opens a "re-verify" issue (once per release line, deduplicated by title).
# Note: GitHub disables scheduled workflows in public repos after 60 days
# without repository activity; re-enable it from the Actions tab if that happens.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report only, do not open issues
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare sheet versions with latest releases
        env:
          GH_TOKEN: ${{ github.token }}
          CREATE_ISSUES: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        run: |
          if [ "$CREATE_ISSUES" = "true" ]; then
            node scripts/version-watch.mjs --create-issues
          else
            node scripts/version-watch.mjs
          fi
